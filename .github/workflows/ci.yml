name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: imresamu/postgis:17-3.5-alpine
        env:
          POSTGRES_USER: barberpro
          POSTGRES_PASSWORD: barberpro
          POSTGRES_DB: barberpro_test
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U barberpro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6390:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generated GraphQL types are up to date
        run: npm run codegen && git diff --exit-code src/shared/adapters/graphql/generated
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:e2e
      - run: npm run build
