name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: imresamu/postgis:17-3.5-alpine
        env:
          POSTGRES_USER: barberpro
          POSTGRES_PASSWORD: barberpro
          POSTGRES_DB: barberpro_test
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U barberpro -d barberpro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6390:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generated GraphQL types are up to date
        run: npm run codegen && git diff --exit-code src/shared/adapters/graphql/generated
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:e2e
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated GraphQL types are up to date
        run: npm run codegen && git diff --exit-code src/gql
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Generated GraphQL types are up to date
        run: npm run codegen && git diff --exit-code src/gql
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - name: Web build
        run: npm run export:web

  web-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: imresamu/postgis:17-3.5-alpine
        env:
          POSTGRES_USER: barberpro
          POSTGRES_PASSWORD: barberpro
          POSTGRES_DB: barberpro_test
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U barberpro -d barberpro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6390:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 8025:8025
          - 1025:1025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
